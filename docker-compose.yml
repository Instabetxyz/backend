services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streambet
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: streambet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streambet"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env.docker
    ports:
      - "5174:5174"

volumes:
  postgres_data:
